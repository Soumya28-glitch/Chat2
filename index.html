<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encrypted Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
    <div class="app-container">
        <div id="login">
            <h2>E2EE Chat</h2>
            <input type="text" id="username" placeholder="Your Name" autocomplete="off">
            <input type="password" id="secret-code" placeholder="Secret PIN" autocomplete="off">
            <p id="login-error"></p>
            <button type="button" class="primary-btn" id="unlock-btn">Unlock Room</button>
        </div>
        <div id="chat" style="display:none;">
            <div class="chat-header"><span id="header-name">Vault</span></div>
            <div id="messages"></div>
            <div id="input-area-container">
                <div id="input-area">
                    <button class="icon-btn" onclick="toggleAttachments()">📎</button>
                    <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
                    <button class="icon-btn" id="mic-btn-dedicated">🎤</button>
                    <button id="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js?v=18"></script>
</body>
</html>
